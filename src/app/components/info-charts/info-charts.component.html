<div class="dashboard-container">
  <div id="pie-chart">
    <apx-chart
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [labels]="chartOptions.labels"
      [responsive]="chartOptions.responsive"
    ></apx-chart>
  </div>

  <div class="boxes">
    <div class="mat-card-container">
      <mat-card class="mat-elevation-z3">
        <mat-card-title class="title">
          {{
            role === "superadmin" ? "Pending Admins" : "Pending Retailers"
          }}</mat-card-title
        >
        <mat-card-content>
          <p class="content">{{ pendingAdmins }}</p>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="mat-card-container">
      <mat-card class="mat-elevation-z3">
        <mat-card-title class="title">
          {{
            role === "superadmin" ? "Approved Admins" : "Approved Retailers"
          }}</mat-card-title
        >
        <mat-card-content>
          <p class="content">{{ approvedAdmins }}</p>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="mat-card-container">
      <mat-card class="mat-elevation-z3">
        <mat-card-title class="title">{{
          role === "superadmin" ? "Rejected Admins" : "Rejected Retailers"
        }}</mat-card-title>
        <mat-card-content>
          <p class="content">{{ rejectedAdmins }}</p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
