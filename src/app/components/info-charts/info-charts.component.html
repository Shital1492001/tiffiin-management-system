<div class="dashboard-container">
  <div id="pie-chart">
    <apx-chart
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [labels]="chartOptions.labels"
      [responsive]="chartOptions.responsive"
    ></apx-chart>
  </div>

  <div class="boxes">
    <div class="mat-card-container" *ngFor="let element of cardsArray">
      <mat-card class="card">
        <mat-card-header class="title">
          {{ role === "superadmin" ? element.superAdmin : element.admin }}
        </mat-card-header>
        <mat-card-content>
          <p class="content">{{ element.count }}</p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
