<div class="container">
  <mat-card class="admin-login">
    <div class="image-section">
      <img
        src="https://img.lovepik.com/element/45009/2860.png_300.png"
        alt="login image"
      />
    </div>
    <div class="form-section">
      <div class="login-section">
        <mat-card-header>Tiffin Services</mat-card-header>
        <form [formGroup]="loginForm" (submit)="loginAdmin()">
          <div class="login">
            <div class="email-input">
              <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input
                  matInput
                  placeholder="Enter your email"
                  formControlName="email"
                  type="email"
                />
                <mat-icon matPrefix>email</mat-icon>
                <mat-error>{{ emailErrorMessage }} </mat-error>
              </mat-form-field>
            </div>
            <div class="password-input">
              <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input
                  matInput
                  placeholder="Enter your password"
                  formControlName="password"
                  [type]="hide ? 'password' : 'text'"
                />
                <button
                  mat-icon-button
                  matSuffix
                  (click)="hide = !hide"
                  [attr.aria-label]="'Toggle password visibility'"
                  [attr.aria-pressed]="!hide"
                >
                  <mat-icon>{{
                    hide ? "visibility_off" : "visibility"
                  }}</mat-icon>
                </button>
                <mat-icon matPrefix>lock</mat-icon>
                <mat-error>{{ passwordErrorMessage }}</mat-error>
              </mat-form-field>
            </div>
            <div class="button">
              <button mat-raised-button type="submit">Login</button>
            </div>
            <mat-error>{{ invalidCredential }}</mat-error>
            <mat-card-footer
              ><a routerLink="/admin-signup" class="link">Sign up</a> as Admin
            </mat-card-footer>
            <mat-card-footer>
              Forgot password?
              <a routerLink="/forgot-password" class="link">Click here</a>
            </mat-card-footer>
          </div>
        </form>
      </div>
    </div>
  </mat-card>
</div>
