<div class="login-page">
  <mat-card>
    <mat-card-header>SuperAdmin Login</mat-card-header>
    <form [formGroup]="loginForm" (submit)="loginAdmin()">
      <div class="login">
        <div>
          <mat-form-field appearance="outline">
            <mat-label>Email Id</mat-label>
            <div>
              <div>
                <mat-icon>person_outline</mat-icon>
              </div>
              <input
                appearance="outlined"
                matInput
                formControlName="email"
                placeholder="Ex. pat@example.com"
              />
            </div>
            <mat-error>{{ emailErrorMessage }} </mat-error>
          </mat-form-field>
        </div>
        <div>
          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <div>
              <mat-icon>lock</mat-icon>
              <input matInput type="password" formControlName="password" />
            </div>

            <mat-error>{{ passwordErrorMessage }}</mat-error>
          </mat-form-field>
        </div>
        <div class="button">
          <button mat-raised-button type="submit" (click)="loginAdmin()">
            Login
          </button>
        </div>
        <mat-error>{{ invalidCredential }}</mat-error>
        <mat-card-footer
          ><a routerLink="">sign up </a>as Admin
        </mat-card-footer>
        <mat-card-footer
          >forgot password <a routerLink="">click here</a>
        </mat-card-footer>
      </div>
    </form>
  </mat-card>
</div>
