<mat-sidenav-container class="example-container">
  <mat-sidenav #sidenav mode="side" opened class="example-sidenav">
    <mat-nav-list>
      <div class="logo-container">
        <img
          src="https://cdni.iconscout.com/illustration/premium/thumb/indian-dabbawala-with-multi-tiffin-as-service-illustration-download-in-svg-png-gif-file-formats--food-colorful-pack-people-illustrations-2210011.png?f=webp"
          alt="Tiffin Logo"
          class="logo"
        />
        <div class="title" style="color: white" *ngIf="isExpanded">
          <b>Tiffin Services</b>
        </div>
      </div>
      <li *ngFor="let item of menus">
        <a mat-list-item [routerLink]="item?.redirectURL">
          <mat-icon *ngIf="item?.icon">{{ item?.icon }}</mat-icon>
          <span *ngIf="isExpanded">{{ item?.displayName }}</span>
        </a>
      </li>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content
    style="background-color: rgb(221, 219, 219); color: black"
  >
    <!-- margin-left: 0px !important; -->
    <mat-toolbar color="primary">
      <button
        mat-mini-fab
        (click)="isExpanded = !isExpanded"
        color="warn"
        style="margin: 10px"
      >
        <mat-icon aria-label="Menu">menu</mat-icon>
      </button>
      <span>My Application</span>
      <span class="example-spacer"></span>
      <button style="border-radius: 10px">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content">
      <h2>Welcome to the App!</h2>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
