<div>
  <div class="admin-login">
    <div class="image-section">
      <img
        src="https://img.lovepik.com/element/45009/2860.png_300.png"
        alt="login image"
      />
    </div>
    <div class="card">
      <div class="login-section">
        <mat-card-header>SuperAdmin Login</mat-card-header>
        <form [formGroup]="loginForm" (submit)="loginAdmin()">
          <div class="login">
            <div>
              <mat-form-field appearance="outline">
                <mat-label>Email Id</mat-label>
                <div>
                  <div>
                    <mat-icon>person_outline</mat-icon>
                  </div>
                  <input
                    appearance="outlined"
                    matInput
                    formControlName="email"
                    placeholder="Ex. pat@example.com"
                  />
                </div>
                <mat-error>{{ emailErrorMessage }} </mat-error>
              </mat-form-field>
            </div>
            <div>
              <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <div>
                  <div>
                    <mat-icon>lock</mat-icon>
                  </div>
                  <input
                    class="input"
                    matInput
                    type="password"
                    formControlName="password"
                  />
                </div>
                <mat-error>{{ passwordErrorMessage }}</mat-error>
              </mat-form-field>
            </div>
            <div class="button">
              <button mat-raised-button type="submit">Login</button>
            </div>
            <mat-error>{{ invalidCredential }}</mat-error>
            <div>
              <mat-card-footer
                ><a routerLink="/signup" class="link">Sign up</a> as Admin
              </mat-card-footer>
            </div>
            <div>
              <mat-card-footer>
                Forgot password?
                <a routerLink="/forgot-password" class="link">Click here</a>
              </mat-card-footer>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
