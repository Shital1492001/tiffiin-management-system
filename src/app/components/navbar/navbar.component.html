<mat-toolbar
  class="mat-elevation-z3"
  style="background-color: rgb(27, 109, 109)"
  ><button mat-icon-button (click)="collapsed.set(!collapsed())">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Tiffin Services</span>
  <span class="example-spacer"></span>
  <button style="border-radius: 10px">
    <mat-icon>account_circle</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav
    opened
    mode="side"
    [style.width]="sidenavWidth()"
    style="border-radius: 0px; background-color: rgb(27, 109, 109)"
  >
    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let item of menus()"
        [routerLink]="item?.redirectURL"
        routerLinkActive
        #rla="routerLinkActive"
        [activated]="rla.isActive"
      >
        <mat-icon style="color: white" matListItemIcon>{{
          item.icon
        }}</mat-icon>
        <span style="color: white" matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content
    class="content"
    [style.margin-left]="sidenavWidth()"
    style="color: black"
  >
    <h2>Welcome to the App!</h2>
  </mat-sidenav-content>
</mat-sidenav-container>
