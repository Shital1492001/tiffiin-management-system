<div class="table-wrapper">
  <table class="table-body" mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td class="mat-row" mat-cell *matCellDef="let element">
        {{ element.username }}
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td class="mat-row" mat-cell *matCellDef="let element">
        {{ element.email }}
      </td>
    </ng-container>

    <ng-container matColumnDef="contact_number">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Contact details</th>
      <td class="mat-row" mat-cell *matCellDef="let element">
        {{ element.contact_number }}
      </td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Organization</th>
      <td class="mat-row" mat-cell *matCellDef="let element">
        {{ element.address }}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td class="mat-row" mat-cell *matCellDef="let element">
        {{ element.role_specific_details?.approval?.[0]?.approval_status || 'N/A' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="_id">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <mat-icon
          class="approved"
          (click)="emitterApprove.emit(element._id)"
          *ngIf="
            element.role_specific_details.approval[0]?.approval_status ===
              'pending' ||
            element.role_specific_details.approval[0]?.approval_status ===
              'rejected'
          "
        >
          check_circle
        </mat-icon>
        <mat-icon
          class="rejected"
          (click)="emitterReject.emit(element._id)"
          *ngIf="
            element.role_specific_details.approval[0]?.approval_status ===
              'pending' ||
            element.role_specific_details.approval[0]?.approval_status ===
              'approved'
          "
        >
          cancel
        </mat-icon>
      </td>
    </ng-container>

    <!-- <ng-container matColumnDef="_id">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <mat-icon
          class="approved"
          (click)="emitterApprove.emit(element._id)"
          *ngIf="element.role_specific_details.approval_status != 'approved'"
          >check_circle</mat-icon
        >
        <mat-icon
          class="rejected"
          (click)="emitterReject.emit(element._id)"
          *ngIf="element.role_specific_details.approval_status != 'rejected'"
          >cancel</mat-icon
        >
      </td>
    </ng-container> -->

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      class="hover-row"
    ></tr>
  </table>
  <mat-paginator
    class="paginator-section"
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons
  ></mat-paginator>
</div>
