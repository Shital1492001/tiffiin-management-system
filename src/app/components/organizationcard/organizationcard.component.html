 <mat-card appearance="outlined" class="card">
    <mat-card-header>
      <div mat-card-avatar class="image"></div>
      <mat-card-title>{{ organization.org_name }}</mat-card-title>
      <mat-card-subtitle
        >Date Of Registration:{{
          organization.org_created_at | date
        }}</mat-card-subtitle
      >
    </mat-card-header>
    <mat-card-content>
      <p>
        <strong>Status:</strong>
        <span [ngClass]="organization.isActive ? 'status-active' : 'status-inactive'">
          {{ organization.isActive ? "Active" : "Inactive" }}</span>
      </p>
    </mat-card-content>
    <mat-card-footer>
      <div class="button-container">
        <a
          mat-raised-button
          type="submit"
          class="edit-button"
          [routerLink]="['/navbar/update-organization', organization._id]"
          >Update<mat-icon class="mat-icon-edit">edit</mat-icon></a
        >
        <a
        mat-raised-button
        type="submit"
        class="edit-button"
        [routerLink]="['/navbar/view-organization', organization._id]"
        >View<mat-icon class="mat-icon-view">visibility</mat-icon></a
      >
        <button
          mat-raised-button
          type="delete"
          class="delete"
          (click)="openDialog('0ms', '0ms')"
        >
          Delete<mat-icon class="mat-icon-delet">delete</mat-icon>
        </button>
      </div>
    </mat-card-footer>
  </mat-card>
